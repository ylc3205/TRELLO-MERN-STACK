name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./trello-web
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'yarn'
        cache-dependency-path: ./trello-web/yarn.lock
    - run: yarn install --frozen-lockfile
    - run: yarn lint
    - run: yarn build

  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./trello-api
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'yarn'
        cache-dependency-path: ./trello-api/yarn.lock
    - run: yarn install --frozen-lockfile
    - run: yarn lint
    - run: yarn build
